<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài liệu – Lucian</title>
  <meta name="description" content="Thư viện tài liệu Machine Vision, IT, lập trình và ngoại ngữ.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="library">
  <a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>

  <header id="site-header" class="site-header"></header>

  <main id="main" class="wrap page">
    <noscript>
      <p class="notice">Trang này cần bật JavaScript để hiển thị danh sách tài liệu.</p>
    </noscript>

    <div class="library">
      <aside class="sidebar" aria-label="Danh mục tài liệu">
        <button type="button" class="btn sidebar-toggle" id="category-toggle"
                aria-expanded="false" aria-controls="category-panel">
          <span class="sidebar-toggle-label">Danh mục</span>
          <span class="sidebar-toggle-current" id="category-current"></span>
          <svg class="chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="sidebar-panel" id="category-panel">
          <h2 class="sidebar-title">Danh mục</h2>
          <ul class="tree" id="category-tree"></ul>
        </div>
      </aside>

      <section class="library-main" aria-labelledby="library-heading">
        <h1 id="library-heading" class="page-title">Thư viện tài liệu</h1>

        <div class="toolbar">
          <div class="search">
            <label class="visually-hidden" for="search-input">Tìm tài liệu</label>
            <input type="search" id="search-input" class="search-input" autocomplete="off"
                   placeholder="Tìm theo tên, tên file, từ khóa…" enterkeyhint="search">
          </div>
          <div class="type-filter" id="type-filter" role="group" aria-label="Lọc theo loại tài liệu"></div>
        </div>

        <p class="result-count" id="result-count" role="status" aria-live="polite"></p>

        <div id="doc-list" class="doc-list"></div>

        <div id="empty-state" class="empty-state" hidden>
          <p class="empty-title">Không tìm thấy tài liệu phù hợp</p>
          <p class="empty-text" id="empty-text"></p>
          <button type="button" class="btn" id="reset-filters">Xóa tìm kiếm và bộ lọc</button>
        </div>
      </section>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/highlight.js"></script>
  <script src="assets/js/library.js"></script>
</body>
</html>
